<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Kingdoms War</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#1b2430;color:#eee}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.hp{font-weight:bold;color:#ffb347}.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.fighter,.hand{background:#263445;border:1px solid #4b6178;border-radius:12px;padding:16px}.fighter.active{outline:3px solid #e5c07b}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{width:110px;height:150px;border-radius:8px;background:#f2e8d5;color:#222;padding:10px;cursor:pointer;border:3px solid #fff;transition:.15s}.card:hover{transform:translateY(-8px);border-color:#e5c07b}.card.attack{background:#e8b7a8}.card.heal{background:#b8d8be}.card.combo{background:#b9c8e8}.name{font-weight:bold;font-size:18px}.cost{font-size:12px;margin-top:65px}.log{height:130px;overflow:auto;background:#111923;border-radius:8px;padding:10px;font-size:14px}.actions{display:flex;gap:10px;margin-top:12px}button{border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}button.primary{background:#e5c07b}button.secondary{background:#53677d;color:white}
@media(max-width:600px){.board{grid-template-columns:1fr}.card{width:92px;height:130px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>三国之战</h1><button id="restart" class="secondary">重新开始</button></div>
<div class="board">
<section id="p1" class="fighter active"><h2>玄羽将军</h2><div>体力：<span id="hp1" class="hp">20</span></div><div id="status1"></div></section>
<section id="p2" class="fighter"><h2>AI · 赤麟侯</h2><div>体力：<span id="hp2" class="hp">20</span></div><div id="status2"></div></section>
</div>
<section class="hand"><h3>你的手牌</h3><div id="cards" class="cards"></div></section>
<div class="actions"><button id="end" class="primary">结束回合</button></div>
<h3>战报</h3><div id="log" class="log"></div>
</div>
<script>
const cards=[
{name:'突袭',type:'attack',cost:5,text:'造成5点伤害'},
{name:'铁壁',type:'heal',cost:0,text:'恢复3点体力'},
{name:'连击',type:'combo',cost:7,text:'造成7点伤害'},
{name:'突袭',type:'attack',cost:5,text:'造成5点伤害'},
{name:'军粮',type:'heal',cost:0,text:'恢复3点体力'}
];
let hp=[20,20],hand=[],turn=0,blocked=[false,false],gameOver=false;
function log(s){const el=document.querySelector('#log');el.innerHTML='<div>'+s+'</div>'+el.innerHTML}
function draw(n=2){for(let i=0;i<n;i++)hand.push(cards[Math.floor(Math.random()*cards.length)])}
function render(){for(let i=0;i<2;i++){document.querySelector('#hp'+(i+1)).textContent=hp[i];document.querySelector('#p'+(i+1)).classList.toggle('active',turn===i&&!gameOver)}document.querySelector('#status1').textContent=blocked[0]?'铁壁效果：本回合免伤':'';document.querySelector('#status2').textContent=blocked[1]?'铁壁效果：本回合免伤':'';
const el=document.querySelector('#cards');el.innerHTML='';hand.forEach((c,i)=>{const d=document.createElement('div');d.className='card '+c.type;d.innerHTML=`<div class="name">${c.name}</div><div>${c.text}</div><div class="cost">点击使用</div>`;d.onclick=()=>play(i);el.appendChild(d)})}
function play(i){if(turn!==0||gameOver)return;const c=hand[i];hand.splice(i,1);if(c.type==='heal'){hp[0]=Math.min(20,hp[0]+3);log('玄羽将军使用军粮，恢复了体力')}else{let dmg=c.cost;if(blocked[1])dmg=0;hp[1]-=dmg;log('玄羽将军使用'+c.name+'，造成'+dmg+'伤害')}render();check();}
function ai(){if(gameOver)return;setTimeout(()=>{if(hp[1]<10&&Math.random()<.6){hp[1]=Math.min(20,hp[1]+3);log('赤麟侯恢复了3点体力')}else{let dmg=Math.random()<.35?7:5;if(blocked[0])dmg=0;hp[0]-=dmg;log('赤麟侯发动攻击，造成'+dmg+'伤害')}draw();render();check();if(!gameOver){turn=0;render();log('轮到你行动')}},500)}
function check(){if(hp[0]<=0||hp[1]<=0){gameOver=true;log(hp[0]<=0?'你失败了！':'胜利！');render();return true}return false}
document.querySelector('#end').onclick=()=>{if(turn!==0||gameOver)return;turn=1;blocked=[false,false];log('赤麟侯开始行动');render();ai()};
document.querySelector('#restart').onclick=()=>{hp=[20,20];hand=[];turn=0;blocked=[false,false];gameOver=false;document.querySelector('#log').innerHTML='';draw(5);log('新的战斗开始');render()};
draw(5);render();log('新的战斗开始');
</script></body></html>
